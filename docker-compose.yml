services:
  # ── Backend API ──
  backend:
    build: ./backend
    container_name: pdf-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pdfuser}:${POSTGRES_PASSWORD:-pdfpass}@postgres:5432/${POSTGRES_DB:-pdfcompare}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:80","http://localhost"]'
      DEV_MODE: "false"
    volumes:
      - uploads_data:/app/uploads
      - results_data:/app/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Celery Worker ──
  worker:
    build: ./backend
    container_name: pdf-worker
    command: celery -A app.workers.celery_app worker --concurrency=4 --loglevel=info
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pdfuser}:${POSTGRES_PASSWORD:-pdfpass}@postgres:5432/${POSTGRES_DB:-pdfcompare}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
      DEV_MODE: "false"
    volumes:
      - uploads_data:/app/uploads
      - results_data:/app/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Frontend ──
  frontend:
    build: ./frontend
    container_name: pdf-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_WS_URL: ws://localhost
    restart: unless-stopped

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: pdf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdfuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdfpass}
      POSTGRES_DB: ${POSTGRES_DB:-pdfcompare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdfuser} -d ${POSTGRES_DB:-pdfcompare}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: pdf-redis
    restart: unless-stopped

  # ── Nginx ──
  nginx:
    image: nginx:alpine
    container_name: pdf-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  results_data:
