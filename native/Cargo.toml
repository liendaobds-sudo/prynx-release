[package]
name = "pdfcompare_native"
version = "0.1.0"
edition = "2021"
description = "Rust native module for PDF page object operations via PDFium FFI"

[lib]
name = "pdfcompare_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
pdfium-render = "0.8"
image = "0.25"
lopdf = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
numpy = "0.23"
rayon = "1.12.0"
geo = "0.28"
imposition_core = { path = "../imposition_core" }

