[package]
name = "pdfcompare_native"
version = "0.1.0"
edition = "2021"
description = "Rust native module for PDF page object operations via PDFium FFI"

[lib]
name = "pdfcompare_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
pdfium-render = "0.8"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2.1"
sha2 = "0.10"
boa_engine = { version = "0.21.1", default-features = false }
numpy = "0.26"
rayon = "1.12.0"
geo = "0.28"
imposition_core = { path = "../imposition_core" }
# PrynX Print Engine — lõi prepress ink-space thay Ghostscript.
print_engine = { path = "../print_engine" }

