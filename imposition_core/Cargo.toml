[package]
name = "imposition_core"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust imposition layout math — single source of truth (no pyo3/tauri/pdf deps)"
license = "MIT"

[lib]
name = "imposition_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
geo = "0.28"
ts-rs = { version = "10", optional = true }

[features]
ts-export = ["dep:ts-rs"]

[dev-dependencies]
serde_json = "1"
