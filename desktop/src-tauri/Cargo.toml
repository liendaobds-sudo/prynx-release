[package]
name = "pdf-inspector"
version = "1.0.0-beta.11"
description = "PDF comparison tool for print industry"
authors = ["PrintSolutions"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2.2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
pdfium-render = { version = "0.8", features = ["thread_safe", "pdfium_use_win32"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif"] }
urlencoding = "2"
tauri-plugin-single-instance = "2.4.2"
chrono = "0.4.44"
base64 = "0.22.1"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2.4.9"
rand = "0.8"
tokio = { version = "1.52.3", features = ["sync"] }
imposition_core = { path = "../../imposition_core" }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# F2: verify token license kÃƒÆ’Ã‚Â½ Ed25519 ngay trong Rust (lÃƒÂ¡Ã‚Â»Ã¢â‚¬Âºp gate thÃƒÂ¡Ã‚Â»Ã‚Â© 2, Ãƒâ€žÃ¢â‚¬ËœÃƒÂ¡Ã‚Â»Ã¢â€žÂ¢c lÃƒÂ¡Ã‚ÂºÃ‚Â­p sidecar).
ed25519-dalek = "2"

# webview2-com: cÃƒÂ¡Ã‚ÂºÃ‚Â§n cho block tÃƒÂ¡Ã‚ÂºÃ‚Â¯t DevTools release-only (lib.rs `use webview2_com::...`).
# Pin Ãƒâ€žÃ¢â‚¬ËœÃƒÆ’Ã‚Âºng version mÃƒÆ’Ã‚Â  tauri/wry resolve (xem Cargo.lock) Ãƒâ€žÃ¢â‚¬ËœÃƒÂ¡Ã‚Â»Ã†â€™ kiÃƒÂ¡Ã‚Â»Ã†â€™u ICoreWebView2Controller
# trÃƒÂ¡Ã‚ÂºÃ‚Â£ vÃƒÂ¡Ã‚Â»Ã‚Â tÃƒÂ¡Ã‚Â»Ã‚Â« `with_webview().controller()` khÃƒÂ¡Ã‚Â»Ã¢â‚¬Âºp vÃƒÂ¡Ã‚Â»Ã¢â‚¬Âºi cÃƒÆ’Ã‚Â¡c interface ta gÃƒÂ¡Ã‚Â»Ã‚Âi.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
# In PDF native qua GDI + PrintDlg (Ctrl+P). pdfium_use_win32 cua pdfium-render
# tham chieu windows::Win32::Graphics::Gdi::HDC -> phai bat Win32_Graphics_Gdi o day
# (cargo hop nhat feature toan cay). Version 0.61 khop cay hien tai (Cargo.lock).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 2
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.pdfium-render]
opt-level = 3
