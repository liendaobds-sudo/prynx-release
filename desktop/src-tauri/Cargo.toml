[package]
name = "pdf-inspector"
version = "1.0.0"
description = "PDF comparison tool for print industry"
authors = ["PrintSolutions"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2.2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
pdfium-render = { version = "0.8", features = ["thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
urlencoding = "2"
tauri-plugin-single-instance = "2.4.2"
chrono = "0.4.44"
base64 = "0.22.1"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2.4.9"
rand = "0.8"
tokio = { version = "1.52.3", features = ["sync"] }
imposition_core = { path = "../../imposition_core" }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# F2: verify token license ký Ed25519 ngay trong Rust (lớp gate thứ 2, độc lập sidecar).
ed25519-dalek = "2"

# webview2-com: cần cho block tắt DevTools release-only (lib.rs `use webview2_com::...`).
# Pin đúng version mà tauri/wry resolve (xem Cargo.lock) để kiểu ICoreWebView2Controller
# trả về từ `with_webview().controller()` khớp với các interface ta gọi.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"

[profile.dev]
opt-level = 2
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.pdfium-render]
opt-level = 3
