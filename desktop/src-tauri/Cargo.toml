[package]
name = "pdf-inspector"
version = "1.0.0-beta.11"
description = "PDF comparison tool for print industry"
authors = ["PrintSolutions"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2.2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
pdfium-render = { version = "0.8", features = ["thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif"] }
urlencoding = "2"
tauri-plugin-single-instance = "2.4.2"
chrono = "0.4.44"
base64 = "0.22.1"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2.4.9"
rand = "0.8"
tokio = { version = "1.52.3", features = ["sync"] }
imposition_core = { path = "../../imposition_core" }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
