[package]
name = "pdf-inspector"
version = "2.0.0"
description = "PDF comparison tool for print industry"
authors = ["PrintSolutions"]
license = "MIT"
edition = "2021"
# BUILD (audit 2026-08-03 §REL.08): MSRV khớp với cây dependency đã khóa.
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2.2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
pdfium-render = { version = "0.8", features = ["thread_safe", "pdfium_use_win32"] }
# PAGEBOX (audit 2026-08-04 §W1.PB6): PDFium đi kèm bỏ qua /UserUnit;
# dùng parser độc lập để đọc hệ số vật lý theo từng trang cho Viewer native.
lopdf = { version = "0.44", default-features = false }
# PERF/COLOR (audit 2026-08-09 §L3A): worker Viewer gọi thẳng PPE Rust;
# không vòng HTTP/Python và không thêm renderer bên ngoài.
print_engine = { path = "../../print_engine" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif"] }
urlencoding = "2"
tauri-plugin-single-instance = "2.4.2"
chrono = "0.4.44"
base64 = "0.22.1"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2.4.9"
rand = "0.8"
tokio = { version = "1.52.3", features = ["sync", "time"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# F2: verify token license Ed25519 ngay trong Rust (lớp gate thứ 2, độc lập sidecar).
ed25519-dalek = "2"

# KIENTRUC (audit 2026-07-29 §E): các comment tiếng Việt trong khối này từng bị mã hoá
# lặp nhiều lần thành chuỗi rác không đọc được, vi phạm rule #4 (comment tiếng Việt).
# Đã viết lại theo đúng nội dung gốc.
#
# webview2-com: cần cho đoạn tắt DevTools ở bản release (lib.rs `use webview2_com::...`).
# Pin ĐÚNG version mà tauri/wry resolve (xem Cargo.lock) để không lệch kiểu
# ICoreWebView2Controller giữa `with_webview().controller()` và interface ta gọi.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
# In PDF native qua GDI + PrintDlg (Ctrl+P). pdfium_use_win32 cua pdfium-render
# tham chieu windows::Win32::Graphics::Gdi::HDC -> phai bat Win32_Graphics_Gdi o day
# (cargo hop nhat feature toan cay). Version 0.61 khop cay hien tai (Cargo.lock).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    # [PROC-LIFECYCLE FIX 2026-08-28 §UP.7] Job Object cho sidecar + worker
    # (src/process_guard.rs). Win32_Security chỉ để có SECURITY_ATTRIBUTES trong
    # chữ ký CreateJobObjectW; ta truyền None nên không dựng ACL nào.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    # SEC (audit 2026-09-04 §SEC.16-A1): khóa định danh thiết bị nằm trong
    # Microsoft Platform Crypto Provider (TPM), ký proof bằng CNG RSA-PSS.
    "Win32_Security_Cryptography",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.pdfium-render]
opt-level = 3
