<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRYNX — Logo Intro Animation</title>
  <meta name="description" content="PRYNX brand intro animation — Print made easy!">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       RESET & BASE
    ============================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f5f7;
      font-family: 'Outfit', sans-serif;
    }

    /* ============================================
       MAIN CONTAINER — 16:9 centered
    ============================================ */
    .intro-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #ffffff 0%, #f0f0f2 70%);
    }

    /* Subtle animated background texture */
    .intro-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1px 1px at 20% 30%, rgba(35, 31, 32, 0.06), transparent),
        radial-gradient(1px 1px at 80% 70%, rgba(35, 31, 32, 0.04), transparent),
        radial-gradient(1px 1px at 50% 50%, rgba(35, 31, 32, 0.03), transparent);
      opacity: 0;
      animation: bgFadeIn 2s ease forwards 0.3s;
    }

    @keyframes bgFadeIn {
      to { opacity: 1; }
    }

    /* ============================================
       LOGO GROUP
    ============================================ */
    .logo-group {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 40px);
      position: relative;
      overflow: hidden;
      padding: 20px 40px;
    }

    /* ============================================
       SVG ICON (draw-on effect)
    ============================================ */
    .logo-icon {
      width: clamp(60px, 8vw, 120px);
      height: clamp(60px, 8vw, 120px);
      position: relative;
      overflow: visible;
    }

    .logo-icon svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Outline paths for drawing effect */
    .logo-icon .draw-path {
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .draw-path-gray {
      stroke: #bdbec1;
    }

    .draw-path-dark1,
    .draw-path-dark2,
    .draw-path-dark3 {
      stroke: #231f20;
    }

    /* Filled shapes (initially hidden) */
    .logo-icon .fill-shape {
      opacity: 0;
    }

    .fill-gray { fill: #bdbec1; }
    .fill-dark { fill: #231f20; }

    /* ============================================
       BRAND TEXT: P R Y N X
    ============================================ */
    .brand-text {
      display: flex;
      align-items: center;
      gap: clamp(2px, 0.6vw, 8px);
    }

    .brand-letter {
      font-size: clamp(36px, 6vw, 80px);
      font-weight: 800;
      color: #231f20;
      letter-spacing: 0.08em;
      line-height: 1;
      opacity: 0;
      transform: translateY(30px);
      display: inline-block;
    }

    /* ============================================
       LIGHT SWEEP OVERLAY
    ============================================ */
    .light-sweep {
      position: absolute;
      top: -20%;
      left: 0;
      width: 60%;
      height: 140%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        transparent 35%,
        rgba(189, 190, 193, 0.12) 42%,
        rgba(189, 190, 193, 0.3) 48%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(189, 190, 193, 0.3) 52%,
        rgba(189, 190, 193, 0.12) 58%,
        transparent 65%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 10;
      transform: translateX(-120%);
    }

    /* ============================================
       SLOGAN
    ============================================ */
    .slogan {
      margin-top: clamp(12px, 2vw, 28px);
      font-size: clamp(12px, 1.8vw, 22px);
      font-weight: 300;
      color: #6b6b70;
      letter-spacing: 1.2em;
      opacity: 0;
      text-transform: uppercase;
    }

    /* ============================================
       BOTTOM ACCENT LINE
    ============================================ */
    .accent-line {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(35, 31, 32, 0.2),
        transparent
      );
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 600px) {
      .logo-group {
        flex-direction: column;
        gap: 12px;
      }
      .slogan {
        letter-spacing: 0.6em;
      }
    }
  </style>
</head>
<body>

  <div class="intro-container">

    <!-- Logo Group: Icon + Text -->
    <div class="logo-group">
      
      <!-- SVG Logo Icon -->
      <div class="logo-icon">
        <svg viewBox="0 0 70.87 70.87" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="logoClip">
              <rect x="0" y="0" width="70.87" height="70.87"/>
            </clipPath>
          </defs>

          <!-- Filled shapes (will fade in after draw) -->
          <polygon class="fill-shape fill-dark" id="fill1" points="24.86 44.95 24.86 70.87 8.93 70.87 8.93 64.57 24.86 44.95"/>
          <polygon class="fill-shape fill-gray" id="fill2" points="37.99 25.33 8.93 60.69 8.93 55.61 29.5 30.27 11.55 8.16 24.06 8.16 37.99 25.33"/>
          <polygon class="fill-shape fill-dark" id="fill3" points="32.87 35.37 61.93 0 61.93 5.08 41.37 30.42 59.01 52.16 46.5 52.16 32.87 35.37"/>
          <polygon class="fill-shape fill-dark" id="fill4" points="8.93 52.16 8.93 8.38 26.7 30.27 8.93 52.16"/>

          <!-- Outline paths for drawing effect -->
          <polygon class="draw-path draw-path-dark1" id="outline1" points="24.86 44.95 24.86 70.87 8.93 70.87 8.93 64.57 24.86 44.95"/>
          <polygon class="draw-path draw-path-gray" id="outline2" points="37.99 25.33 8.93 60.69 8.93 55.61 29.5 30.27 11.55 8.16 24.06 8.16 37.99 25.33"/>
          <polygon class="draw-path draw-path-dark2" id="outline3" points="32.87 35.37 61.93 0 61.93 5.08 41.37 30.42 59.01 52.16 46.5 52.16 32.87 35.37"/>
          <polygon class="draw-path draw-path-dark3" id="outline4" points="8.93 52.16 8.93 8.38 26.7 30.27 8.93 52.16"/>
        </svg>
      </div>

      <!-- Brand Text -->
      <div class="brand-text">
        <span class="brand-letter" data-letter="P">P</span>
        <span class="brand-letter" data-letter="R">R</span>
        <span class="brand-letter" data-letter="Y">Y</span>
        <span class="brand-letter" data-letter="N">N</span>
        <span class="brand-letter" data-letter="X">X</span>
      </div>

      <!-- Light Sweep -->
      <div class="light-sweep"></div>
    </div>

    <!-- Slogan -->
    <div class="slogan">Print made easy!</div>

    <!-- Bottom Accent Line -->
    <div class="accent-line"></div>
  </div>

  <!-- GSAP CDN (official, free) -->
  <script src="./vendor/gsap.min.js"></script>

  <script>
    /* ============================================
       PRYNX Logo Intro Animation
       Using GSAP Timeline — gsap-skills best practices
       Total duration: ~4.5s + 1s hold
    ============================================ */

    // Wait for fonts & DOM
    document.fonts.ready.then(() => {

      // ── Prepare SVG outline paths ──
      const outlines = document.querySelectorAll('.draw-path');
      outlines.forEach(path => {
        const length = path.getTotalLength();
        // Set initial state: path fully hidden
        gsap.set(path, {
          strokeDasharray: length,
          strokeDashoffset: length,
          opacity: 1
        });
      });

      // ── Set initial states (GSAP best practice: use gsap.set) ──
      gsap.set('.fill-shape', { opacity: 0 });
      gsap.set('.brand-letter', { opacity: 0, y: 30 });
      gsap.set('.slogan', { opacity: 0, letterSpacing: '1.2em' });
      gsap.set('.light-sweep', { xPercent: -120 });
      gsap.set('.accent-line', { width: 0 });

      // ── Create master timeline ──
      const tl = gsap.timeline({
        defaults: {
          ease: 'power3.out',
          duration: 0.6
        }
      });

      // ── Phase 1: Draw SVG outline paths (0s → 1.2s) ──
      tl.to('#outline4', {
        strokeDashoffset: 0,
        duration: 0.8,
        ease: 'power2.inOut'
      }, 0)
      .to('#outline2', {
        strokeDashoffset: 0,
        duration: 1,
        ease: 'power2.inOut'
      }, 0.15)
      .to('#outline3', {
        strokeDashoffset: 0,
        duration: 1,
        ease: 'power2.inOut'
      }, 0.25)
      .to('#outline1', {
        strokeDashoffset: 0,
        duration: 0.7,
        ease: 'power2.inOut'
      }, 0.4)

      // ── Phase 2: Flash fill — outlines fade, fills appear (1.2s → 1.8s) ──
      .to(outlines, {
        opacity: 0,
        duration: 0.3,
        ease: 'power1.in'
      }, 1.3)
      .to('.fill-shape', {
        opacity: 1,
        duration: 0.4,
        stagger: 0.06,
        ease: 'power2.out'
      }, 1.35)

      // ── Phase 3: Brand letters appear L→R (1.6s → 2.6s) ──
      .to('.brand-letter', {
        opacity: 1,
        y: 0,
        duration: 0.5,
        stagger: 0.1,
        ease: 'back.out(1.7)'
      }, 1.6)

      // ── Phase 4: Light sweep across entire logo (2.4s → 3.2s) ──
      .to('.light-sweep', {
        xPercent: 320,
        duration: 0.9,
        ease: 'power2.inOut'
      }, 2.4)

      // ── Phase 5: Slogan fade + tracking narrow (3.0s → 3.8s) ──
      .to('.slogan', {
        opacity: 1,
        letterSpacing: '0.35em',
        duration: 0.8,
        ease: 'power2.out'
      }, 3.0)

      // ── Phase 6: Accent line grows (3.2s → 3.8s) ──
      .to('.accent-line', {
        width: 'clamp(100px, 30vw, 350px)',
        duration: 0.7,
        ease: 'power3.inOut'
      }, 3.2)

      // ── Phase 7: Subtle pulse on icon (3.6s) — final settle ──
      .to('.logo-icon', {
        scale: 1.04,
        duration: 0.3,
        ease: 'power2.out'
      }, 3.6)
      .to('.logo-icon', {
        scale: 1,
        duration: 0.4,
        ease: 'elastic.out(1, 0.4)'
      }, 3.9);

      // ── After animation: hold for 1 second, then stay ──
      // Total: ~4.3s animation + natural hold = ~5.3s

    });
  </script>

</body>
</html>
