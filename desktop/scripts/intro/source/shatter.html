<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRYNX — Cinematic Shatter Animation</title>
  <meta name="description" content="PRYNX brand intro — Cinematic Shatter & Assemble animation">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       RESET & BASE
    ============================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f5f7;
      font-family: 'Outfit', sans-serif;
    }

    /* ============================================
       MAIN CONTAINER
    ============================================ */
    .intro-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #ffffff 0%, #f0f0f2 70%);
    }

    /* ============================================
       LOGO GROUP (icon + text)
    ============================================ */
    .logo-group {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 40px);
      position: relative;
    }

    /* ============================================
       SVG LOGO ICON — Shatter container
    ============================================ */
    .logo-icon-container {
      width: clamp(70px, 9vw, 130px);
      height: clamp(70px, 9vw, 130px);
      position: relative;
    }

    /* Each shard is an absolutely positioned copy */
    .shard {
      position: absolute;
      inset: 0;
      will-change: transform, opacity;
    }

    .shard svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .shard-fill-gray { fill: #bdbec1; }
    .shard-fill-dark { fill: #231f20; }

    /* Hide non-target polygons in each shard */
    .shard .hidden-poly { opacity: 0; }

    /* ============================================
       DECORATIVE GLASS SHARDS (fly-in fragments)
    ============================================ */
    .glass-shard {
      position: absolute;
      width: 20px;
      height: 20px;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .glass-shard svg {
      width: 100%;
      height: 100%;
    }

    .glass-shard polygon {
      fill: none;
      stroke: #bdbec1;
      stroke-width: 0.5;
    }

    /* ============================================
       FLASH BURST on assembly
    ============================================ */
    .flash-burst {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(189, 190, 193, 0.5) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
    }

    /* ============================================
       GLOW behind logo
    ============================================ */
    .logo-glow {
      position: absolute;
      width: 180%;
      height: 180%;
      top: -40%;
      left: -40%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(189, 190, 193, 0.15) 0%, transparent 60%);
      opacity: 0;
      pointer-events: none;
    }

    /* ============================================
       BRAND TEXT: P R Y N X — Stamp effect
    ============================================ */
    .brand-text {
      display: flex;
      align-items: center;
      gap: clamp(2px, 0.5vw, 6px);
      position: relative;
    }

    .stamp-letter {
      font-size: clamp(40px, 6.5vw, 90px);
      font-weight: 900;
      color: #231f20;
      letter-spacing: 0.06em;
      line-height: 1;
      display: inline-block;
      opacity: 0;
      transform: scale(2.5);
      will-change: transform, opacity;
      position: relative;
    }

    /* Impact ring behind each letter on stamp */
    .impact-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      border: 2px solid rgba(189, 190, 193, 0.6);
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
    }

    /* ============================================
       SLOGAN
    ============================================ */
    .slogan {
      margin-top: clamp(16px, 2.5vw, 32px);
      font-size: clamp(13px, 1.8vw, 22px);
      font-weight: 300;
      color: #6b6b70;
      letter-spacing: 0.8em;
      text-transform: uppercase;
      overflow: hidden;
    }

    .slogan-word {
      display: inline-block;
      opacity: 0;
      filter: blur(8px);
      transform: translateY(15px);
    }

    /* ============================================
       ACCENT LINE
    ============================================ */
    .accent-line {
      position: absolute;
      bottom: 14%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(35, 31, 32, 0.15),
        transparent
      );
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 600px) {
      .logo-group {
        flex-direction: column;
        gap: 16px;
      }
      .slogan {
        letter-spacing: 0.4em;
      }
    }
  </style>
</head>
<body>

<div class="intro-container">
  <div class="logo-group">

    <!-- Logo Icon: Shatter container -->
    <div class="logo-icon-container" id="logoContainer">

      <!-- Glow behind -->
      <div class="logo-glow" id="logoGlow"></div>

      <!-- Flash burst -->
      <div class="flash-burst" id="flashBurst"></div>

      <!-- Shard 1: bottom-left leg (st1 / #231f20) -->
      <div class="shard" id="shard1">
        <svg viewBox="0 0 70.87 70.87" xmlns="http://www.w3.org/2000/svg">
          <polygon class="shard-fill-dark" points="24.86 44.95 24.86 70.87 8.93 70.87 8.93 64.57 24.86 44.95"/>
        </svg>
      </div>

      <!-- Shard 2: diagonal cross (st0 / #bdbec1) -->
      <div class="shard" id="shard2">
        <svg viewBox="0 0 70.87 70.87" xmlns="http://www.w3.org/2000/svg">
          <polygon class="shard-fill-gray" points="37.99 25.33 8.93 60.69 8.93 55.61 29.5 30.27 11.55 8.16 24.06 8.16 37.99 25.33"/>
        </svg>
      </div>

      <!-- Shard 3: upper-right arm (st1 / #231f20) -->
      <div class="shard" id="shard3">
        <svg viewBox="0 0 70.87 70.87" xmlns="http://www.w3.org/2000/svg">
          <polygon class="shard-fill-dark" points="32.87 35.37 61.93 0 61.93 5.08 41.37 30.42 59.01 52.16 46.5 52.16 32.87 35.37"/>
        </svg>
      </div>

      <!-- Shard 4: left triangle (st1 / #231f20) -->
      <div class="shard" id="shard4">
        <svg viewBox="0 0 70.87 70.87" xmlns="http://www.w3.org/2000/svg">
          <polygon class="shard-fill-dark" points="8.93 52.16 8.93 8.38 26.7 30.27 8.93 52.16"/>
        </svg>
      </div>

      <!-- Decorative glass shards (fly alongside) -->
      <div class="glass-shard" id="glass1">
        <svg viewBox="0 0 20 20"><polygon points="2,1 18,5 14,19 1,15"/></svg>
      </div>
      <div class="glass-shard" id="glass2">
        <svg viewBox="0 0 20 20"><polygon points="5,0 20,3 17,18 0,12"/></svg>
      </div>
      <div class="glass-shard" id="glass3">
        <svg viewBox="0 0 20 20"><polygon points="1,5 15,0 19,14 8,19"/></svg>
      </div>
      <div class="glass-shard" id="glass4">
        <svg viewBox="0 0 20 20"><polygon points="10,0 20,10 10,20 0,10"/></svg>
      </div>
      <div class="glass-shard" id="glass5">
        <svg viewBox="0 0 20 20"><polygon points="3,2 19,1 16,17 0,14"/></svg>
      </div>
      <div class="glass-shard" id="glass6">
        <svg viewBox="0 0 20 20"><polygon points="0,8 12,0 20,12 8,20"/></svg>
      </div>

    </div>

    <!-- Brand Text: Stamp letters -->
    <div class="brand-text" id="brandText">
      <span class="stamp-letter" id="stampP">P<span class="impact-ring"></span></span>
      <span class="stamp-letter" id="stampR">R<span class="impact-ring"></span></span>
      <span class="stamp-letter" id="stampY">Y<span class="impact-ring"></span></span>
      <span class="stamp-letter" id="stampN">N<span class="impact-ring"></span></span>
      <span class="stamp-letter" id="stampX">X<span class="impact-ring"></span></span>
    </div>

  </div>

  <!-- Slogan -->
  <div class="slogan" id="slogan">
    <span class="slogan-word">Print</span>&nbsp;
    <span class="slogan-word">made</span>&nbsp;
    <span class="slogan-word">easy!</span>
  </div>

  <!-- Accent Line -->
  <div class="accent-line" id="accentLine"></div>
</div>

<!-- GSAP CDN (100% free including all plugins) -->
<script src="./vendor/gsap.min.js"></script>

<script>
  /* ============================================
     PRYNX — Cinematic Shatter & Assemble
     GSAP Timeline + gsap.utils.random()
     ~4.5s animation + 1s hold
  ============================================ */

  document.fonts.ready.then(() => {

    // ── References ──
    const shards = ['#shard1', '#shard2', '#shard3', '#shard4'];
    const glassShards = ['#glass1', '#glass2', '#glass3', '#glass4', '#glass5', '#glass6'];
    const stampLetters = document.querySelectorAll('.stamp-letter');
    const impactRings = document.querySelectorAll('.impact-ring');
    const sloganWords = document.querySelectorAll('.slogan-word');

    // ── Random scatter function using gsap.utils.random ──
    const randX = gsap.utils.random(-500, 500, 1, true);
    const randY = gsap.utils.random(-400, 400, 1, true);
    const randRot = gsap.utils.random(-180, 180, 1, true);
    const randScale = gsap.utils.random(0.3, 1.8, 0.1, true);

    // ── Set initial scatter state for logo shards ──
    shards.forEach(sel => {
      gsap.set(sel, {
        x: randX(),
        y: randY(),
        rotation: randRot(),
        scale: randScale(),
        opacity: 0
      });
    });

    // ── Set initial scatter for glass shards ──
    glassShards.forEach(sel => {
      gsap.set(sel, {
        x: randX(),
        y: randY(),
        rotation: randRot(),
        scale: gsap.utils.random(0.5, 2),
        opacity: 0
      });
    });

    // ── Set initial states ──
    gsap.set('.stamp-letter', { opacity: 0, scale: 2.5 });
    gsap.set('.impact-ring', { opacity: 0, width: 0, height: 0 });
    gsap.set('.slogan-word', { opacity: 0, filter: 'blur(8px)', y: 15 });
    gsap.set('#logoGlow', { opacity: 0, scale: 0.5 });
    gsap.set('#flashBurst', { opacity: 0, scale: 0.3 });
    gsap.set('#accentLine', { width: 0 });

    // ── Master Timeline ──
    const tl = gsap.timeline({
      defaults: { ease: 'power3.out' }
    });

    // ═══════════════════════════════════════════
    // PHASE 1: Shatter Assembly (0s → 1.5s)
    // Shards fly from scattered positions to origin
    // ═══════════════════════════════════════════

    // Glass shards fly in first (decorative)
    tl.to(glassShards, {
      x: 0,
      y: 0,
      rotation: 0,
      scale: 0.6,
      opacity: 0.5,
      duration: 1.0,
      stagger: {
        amount: 0.3,
        from: 'random'
      },
      ease: 'power2.inOut'
    }, 0)

    // Logo shards fly in and assemble
    .to('#shard4', {
      x: 0, y: 0, rotation: 0, scale: 1, opacity: 1,
      duration: 0.9,
      ease: 'power3.inOut'
    }, 0.15)
    .to('#shard2', {
      x: 0, y: 0, rotation: 0, scale: 1, opacity: 1,
      duration: 1.0,
      ease: 'power3.inOut'
    }, 0.25)
    .to('#shard3', {
      x: 0, y: 0, rotation: 0, scale: 1, opacity: 1,
      duration: 0.95,
      ease: 'power3.inOut'
    }, 0.3)
    .to('#shard1', {
      x: 0, y: 0, rotation: 0, scale: 1, opacity: 1,
      duration: 0.85,
      ease: 'power3.inOut'
    }, 0.4)

    // Glass shards fade out as they arrive
    .to(glassShards, {
      opacity: 0,
      scale: 0,
      duration: 0.4,
      stagger: 0.05,
      ease: 'power2.in'
    }, 1.0)

    // ═══════════════════════════════════════════
    // PHASE 2: Assembly Flash (1.3s → 1.7s)
    // Quick bright flash when logo is assembled
    // ═══════════════════════════════════════════

    .to('#flashBurst', {
      opacity: 1,
      scale: 1,
      duration: 0.15,
      ease: 'power4.out'
    }, 1.3)
    .to('#flashBurst', {
      opacity: 0,
      scale: 1.5,
      duration: 0.4,
      ease: 'power2.out'
    }, 1.45)

    // Glow appears softly
    .to('#logoGlow', {
      opacity: 1,
      scale: 1,
      duration: 0.6,
      ease: 'power2.out'
    }, 1.35)

    // ═══════════════════════════════════════════
    // PHASE 3: Stamp Text (1.6s → 2.8s)
    // Each letter "stamps" down with impact
    // ═══════════════════════════════════════════

    .to('#stampP', {
      opacity: 1,
      scale: 1,
      duration: 0.25,
      ease: 'back.out(2)'
    }, 1.6)
    .to('#stampP .impact-ring', {
      opacity: 0.6,
      width: 60,
      height: 60,
      duration: 0.4,
      ease: 'power3.out'
    }, 1.6)
    .to('#stampP .impact-ring', {
      opacity: 0,
      width: 80,
      height: 80,
      duration: 0.3,
      ease: 'power2.out'
    }, 1.75)

    .to('#stampR', {
      opacity: 1,
      scale: 1,
      duration: 0.25,
      ease: 'back.out(2)'
    }, 1.82)
    .to('#stampR .impact-ring', {
      opacity: 0.5,
      width: 55,
      height: 55,
      duration: 0.35
    }, 1.82)
    .to('#stampR .impact-ring', {
      opacity: 0,
      width: 75,
      height: 75,
      duration: 0.25
    }, 1.97)

    .to('#stampY', {
      opacity: 1,
      scale: 1,
      duration: 0.25,
      ease: 'back.out(2)'
    }, 2.04)
    .to('#stampY .impact-ring', {
      opacity: 0.5,
      width: 55,
      height: 55,
      duration: 0.35
    }, 2.04)
    .to('#stampY .impact-ring', {
      opacity: 0,
      width: 75,
      height: 75,
      duration: 0.25
    }, 2.19)

    .to('#stampN', {
      opacity: 1,
      scale: 1,
      duration: 0.25,
      ease: 'back.out(2)'
    }, 2.26)
    .to('#stampN .impact-ring', {
      opacity: 0.5,
      width: 55,
      height: 55,
      duration: 0.35
    }, 2.26)
    .to('#stampN .impact-ring', {
      opacity: 0,
      width: 75,
      height: 75,
      duration: 0.25
    }, 2.41)

    .to('#stampX', {
      opacity: 1,
      scale: 1,
      duration: 0.25,
      ease: 'back.out(2)'
    }, 2.48)
    .to('#stampX .impact-ring', {
      opacity: 0.6,
      width: 65,
      height: 65,
      duration: 0.4
    }, 2.48)
    .to('#stampX .impact-ring', {
      opacity: 0,
      width: 90,
      height: 90,
      duration: 0.3
    }, 2.65)

    // ═══════════════════════════════════════════
    // PHASE 4: Slogan — blur to sharp (2.8s → 3.6s)
    // ═══════════════════════════════════════════

    .to('.slogan-word', {
      opacity: 1,
      filter: 'blur(0px)',
      y: 0,
      duration: 0.5,
      stagger: 0.15,
      ease: 'power2.out'
    }, 2.9)

    // ═══════════════════════════════════════════
    // PHASE 5: Accent line + Glow pulse (3.3s → 4.2s)
    // ═══════════════════════════════════════════

    .to('#accentLine', {
      width: 'clamp(120px, 30vw, 360px)',
      duration: 0.7,
      ease: 'power3.inOut'
    }, 3.3)

    // Glow pulse
    .to('#logoGlow', {
      scale: 1.15,
      opacity: 0.8,
      duration: 0.3,
      ease: 'power2.out'
    }, 3.5)
    .to('#logoGlow', {
      scale: 1,
      opacity: 0.5,
      duration: 0.5,
      ease: 'power2.inOut'
    }, 3.8)

    // ═══════════════════════════════════════════
    // PHASE 6: Settle (4.0s → 4.5s)
    // Subtle breathing animation then hold
    // ═══════════════════════════════════════════

    .to('.logo-icon-container', {
      scale: 1.03,
      duration: 0.25,
      ease: 'power2.out'
    }, 4.0)
    .to('.logo-icon-container', {
      scale: 1,
      duration: 0.35,
      ease: 'elastic.out(1, 0.5)'
    }, 4.25);

    // ── Total: ~4.6s animation, then hold ──

  });
</script>

</body>
</html>
