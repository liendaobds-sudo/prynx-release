[package]
name = "gpu_capability_probe"
version = "0.1.0"
edition = "2021"
description = "Cong cu tham do nang luc GPU (wgpu, D3D12/Vulkan) cho PPE Viewer GPU"

[workspace]

[[bin]]
name = "gpu_capability_probe"
path = "src/main.rs"

[dependencies]
wgpu = "24"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

